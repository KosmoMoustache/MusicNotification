name: Run runtime tests

on:
    workflow_dispatch:
        inputs:
            mod_loaders:
                description: "Optional list of mod loaders to run"
                required: false
                default: ""
                type: string
            versions:
                description: "Optional list of Minecraft versions to run"
                required: false
                default: ""
                type: string
            skip_build:
                description: "Skip internal build and reuse artifacts from caller workflow"
                required: false
                default: false
                type: boolean
    workflow_call:
        inputs:
            mod_loaders:
                description: "Optional list of mod loaders to run"
                required: false
                default: ""
                type: string
            versions:
                description: "Optional list of Minecraft versions to run"
                required: false
                default: ""
                type: string
            skip_build:
                description: "Skip internal build and reuse artifacts from caller workflow"
                required: false
                default: false
                type: boolean

jobs:
    build:
        if: ${{ !inputs.skip_build }}
        uses: ./.github/workflows/build.yml
        with:
            mod_loaders: ${{ inputs.mod_loaders || github.event.inputs.mod_loaders || '' }}
            versions: ${{ inputs.versions || github.event.inputs.versions || '' }}

    generate-run-matrix:
        runs-on: ubuntu-latest
        name: Generate run matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Grant execute permission to generate-build-matrix.sh
                run: chmod +x ./.github/scripts/generate-build-matrix.sh

            -   name: Generate matrix for runtime jobs
                id: set-matrix
                run: ./.github/scripts/generate-build-matrix.sh "${{ inputs.mod_loaders || github.event.inputs.mod_loaders || '' }}" "${{ inputs.versions || github.event.inputs.versions || '' }}"

    run-client:
        runs-on: ubuntu-latest
        needs: [ build, generate-run-matrix ]
        if: ${{ always() && needs.generate-run-matrix.result == 'success' && (inputs.skip_build || needs.build.result == 'success') }}
        name: Runtime client ${{ matrix.mod_loader }} ${{ matrix.version }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-run-matrix.outputs.matrix) }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Grant execute permission to parse-gradle-properties.sh
                run: chmod +x ./.github/scripts/parse-gradle-properties.sh

            -   name: Parse gradle properties
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: "temurin"
                    java-version: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}

            -   name: Download build artifact
                uses: actions/download-artifact@v8
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ matrix.version }}-artifacts-${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    path: artifacts

            -   name: Stage mod and runtime test assets
                run: |
                    mkdir -p run/mods
                    cp artifacts/${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ matrix.version }}.jar run/mods/

                    mkdir -p run/saves/wd_PlaygroundVoid/datapacks
                    mkdir -p run/resourcepacks

                    cp -a test/wd_PlaygroundVoid run/saves/
                    cp -a test/dp_* run/saves/wd_PlaygroundVoid/datapacks/
                    cp -a test/rp_* run/resourcepacks/

                    if [[ -f "test/options.txt" ]]; then
                        cp test/options.txt run/options.txt
                    fi

            -   name: Run client runtime test
                uses: headlesshq/mc-runtime-test@4.1.0
                with:
                    mc: ${{ matrix.version }}
                    modloader: ${{ matrix.mod_loader }}
                    regex: ${{ matrix.mod_loader == 'fabric' && '.*fabric.*' || matrix.mod_loader == 'neoforge' && '.*neoforge.*' || '.*forge.*' }}
                    mc-runtime-test: ${{ matrix.mod_loader == 'forge' && 'lexforge' || matrix.mod_loader }}
                    java: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}

    run-server:
        runs-on: ubuntu-latest
        needs: [ build, generate-run-matrix ]
        if: ${{ always() && needs.generate-run-matrix.result == 'success' && (inputs.skip_build || needs.build.result == 'success') }}
        name: Runtime server ${{ matrix.mod_loader }} ${{ matrix.version }}
        strategy:
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-run-matrix.outputs.matrix) }}

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v6

            -   name: Grant execute permission to parse-gradle-properties.sh
                run: chmod +x ./.github/scripts/parse-gradle-properties.sh

            -   name: Parse gradle properties
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: "temurin"
                    java-version: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}

            -   name: Download build artifact
                uses: actions/download-artifact@v8
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ matrix.version }}-artifacts-${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    path: artifacts

            -   name: Stage mod
                run: |
                    mkdir -p run/mods
                    cp artifacts/${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ matrix.version }}.jar run/mods/

            -   name: Run server runtime test
                uses: headlesshq/mc-runtime-test@4.1.0
                with:
                    mc: ${{ matrix.version }}
                    modloader: ${{ matrix.mod_loader }}
                    regex: ${{ matrix.mod_loader == 'fabric' && '.*fabric.*' || matrix.mod_loader == 'neoforge' && '.*neoforge.*' || '.*forge.*' }}
                    mc-runtime-test: ${{ matrix.mod_loader == 'forge' && 'lexforge' || matrix.mod_loader }}
                    java: ${{ steps.gradle-properties.outputs.JAVA_VERSION }}
                    xvfb: "false"
                    headlessmc-command: '--jvm "-Djava.awt.headless=true" --server'
