name: Publish on Modrinth, Github & CurseForge

on:
    workflow_dispatch:
        inputs:
            mod_loaders:
                description: "List of mod loaders to be published"
                required: true
                default: "['fabric', 'neoforge']"
                type: string
            versions:
                description: "List of versions to be published"
                required: true
                default: "['1.21', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.8']"
                type: string

permissions:
    contents: write

jobs:
    build:
        uses: ./.github/workflows/build.yml

    generate-publish-matrix:
        runs-on: ubuntu-latest
        name: Generate publish matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@v5
                with:
                    fetch-depth: 1

            -   name: Grant execute permission to generate-publish-matrix.sh
                run: chmod +x ./.github/scripts/generate-publish-matrix.sh

            -   name: "Generate matrix for the publish job"
                id: set-matrix
                run: ./.github/scripts/generate-publish-matrix.sh "${{ inputs.mod_loaders }}" "${{ inputs.versions }}"

    Publish:
        runs-on: ubuntu-latest
        needs: [ build, generate-publish-matrix ]
        name: Publish ${{ matrix.mod_loader }} ${{ matrix.version }}
        strategy:
            max-parallel: 3
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-publish-matrix.outputs.matrix) }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v5
            -   name: Grant execute permission to parse-gradle-properties.sh
                run: chmod +x ./.github/scripts/parse-gradle-properties.sh

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: "Download artifacts"
                uses: actions/download-artifact@v4
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-artifacts-${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    path: artifacts

            -   name: Install changelog parser
                uses: taiki-e/install-action@parse-changelog

            -   name: Parse changelog
                run: parse-changelog CHANGELOG.md ${{ steps.gradle-properties.outputs.MOD_VERSION }} > RELEASE_CHANGELOG.md

            -   name: Publish ${{ matrix.mod_loader }}
                uses: Kir-Antipov/mc-publish@v3.3.0
                with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    github-tag: v${{ steps.gradle-properties.outputs.MINECRAFT_VERSION }}-${{ steps.gradle-properties.outputs.MOD_VERSION }} #mc${{ steps.gradle-properties.outputs.MINECRAFT_VERSION }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}

                    curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
                    curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

                    modrinth-featured: true
                    modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
                    modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

                    name: ${{ steps.gradle-properties.outputs.MOD_NAME }} ${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    version: ${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ steps.gradle-properties.outputs.MINECRAFT_VERSION }}
                    loaders: ${{ join(matrix.supported_mod_loaders, ' ') }}
                    game-versions: |
                        >=${{ steps.gradle-properties.outputs.MIN_MINECRAFT_VERSION }} <=${{ steps.gradle-properties.outputs.MINECRAFT_VERSION }}
                    game-version-filter: releases
                    changelog-file: RELEASE_CHANGELOG.md
                    files: artifacts/${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ matrix.version }}.jar # see buildSrc/src/main/kotlin/multiloader-common.gradle.kts

                    retry-attempts: 6
                    retry-delay: 30000
