name: Publish on selected platforms

on:
    workflow_dispatch:
        inputs:
            mod_loaders:
                description: "List of mod loaders to be published"
                required: false
                default: ""
                type: string
            versions:
                description: "List of versions to be published"
                required: false
                default: ""
                type: string
            platforms:
                description: "Optional list of publish targets: github, curseforge, modrinth"
                required: false
                default: ""
                type: string
    workflow_call:
        inputs:
            mod_loaders:
                description: "List of mod loaders to be published"
                required: false
                default: ""
                type: string
            versions:
                description: "List of versions to be published"
                required: false
                default: ""
                type: string
            platforms:
                description: "Optional list of publish targets: github, curseforge, modrinth"
                required: false
                default: ""
                type: string

permissions:
    contents: write

jobs:
    build:
        uses: ./.github/workflows/build.yml
        with:
            mod_loaders: ${{ inputs.mod_loaders || '' }}
            versions: ${{ inputs.versions || '' }}
            run_tests: false

    generate-publish-matrix:
        runs-on: ubuntu-latest
        name: Generate publish matrix
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@v6
                with:
                    fetch-depth: 1

            -   name: Grant execute permission to generate-build-matrix.sh
                run: chmod +x ./.github/scripts/generate-build-matrix.sh

            -   name: "Generate matrix for the publish-on-platforms job"
                id: set-matrix
                run: ./.github/scripts/generate-build-matrix.sh "${{ inputs.mod_loaders || '' }}" "${{ inputs.versions || '' }}"

    create-github-release:
        runs-on: ubuntu-latest
        name: Create github release
        steps:
            -   name: "Checkout repository"
                uses: actions/checkout@v6
                with:
                    fetch-depth: 1

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: Install changelog parser
                uses: taiki-e/install-action@parse-changelog

            -   name: Parse changelog
                run: parse-changelog CHANGELOG.md ${{ steps.gradle-properties.outputs.MOD_VERSION }} > RELEASE_CHANGELOG.md

            -   name: "Create github release"
                continue-on-error: true
                uses: ncipollo/release-action@v1
                with:
                    skipIfReleaseExists: true
                    allowUpdates: true
                    omitBodyDuringUpdate: true
                    omitDraftDuringUpdate: true
                    omitNameDuringUpdate: true
                    omitPrereleaseDuringUpdate: true
                    tag: ${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    name: ${{ steps.gradle-properties.outputs.MOD_NAME }} ${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    generateReleaseNotes: true
                    bodyFile: RELEASE_CHANGELOG.md

    publish-on-platforms:
        runs-on: ubuntu-latest
        needs: [ build, generate-publish-matrix, create-github-release ]
        name: Publish ${{ matrix.mod_loader }} ${{ matrix.version }}
        strategy:
            max-parallel: 3
            fail-fast: false
            matrix: ${{ fromJson(needs.generate-publish-matrix.outputs.matrix) }}

        steps:
            -   name: Checkout Repository
                uses: actions/checkout@v6

            -   name: Grant execute permission to parse-gradle-properties.sh
                run: chmod +x ./.github/scripts/parse-gradle-properties.sh

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh ${{ matrix.version }}

            -   name: "Download artifacts"
                uses: actions/download-artifact@v8 # TODO: single file https://github.com/actions/download-artifact/releases/tag/v8.0.0
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ matrix.version }}-artifacts-${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    path: artifacts

            -   name: Resolve publish platforms
                id: publish-platforms
                run: |
                    raw="${{ inputs.platforms || github.event.inputs.platforms || '' }}"
                    raw="${raw//[\[\]\']/}"
                    raw="${raw//\"/}"
                    raw="${raw// /}"

                    enabled_github=false
                    enabled_curseforge=false
                    enabled_modrinth=false

                    if [[ -z "$raw" ]]; then
                        enabled_github=true
                        enabled_curseforge=true
                        enabled_modrinth=true
                    else
                        list=",$raw,"
                        [[ "$list" == *,github,* ]] && enabled_github=true
                        [[ "$list" == *,curseforge,* ]] && enabled_curseforge=true
                        [[ "$list" == *,modrinth,* ]] && enabled_modrinth=true
                    fi

                    echo "github=$enabled_github" >> "$GITHUB_OUTPUT"
                    echo "curseforge=$enabled_curseforge" >> "$GITHUB_OUTPUT"
                    echo "modrinth=$enabled_modrinth" >> "$GITHUB_OUTPUT"

            -   name: Install changelog parser
                uses: taiki-e/install-action@parse-changelog

            -   name: Parse changelog
                run: parse-changelog CHANGELOG.md ${{ steps.gradle-properties.outputs.MOD_VERSION }} > RELEASE_CHANGELOG.md

            -   name: Publish ${{ matrix.mod_loader }}
                id: mc-publish
                uses: Kir-Antipov/mc-publish@v3
                with:
                    github-token: ${{ steps.publish-platforms.outputs.github == 'true' && secrets.GITHUB_TOKEN || '' }}
                    github-tag: ${{ steps.gradle-properties.outputs.MOD_VERSION }}

                    curseforge-id: ${{ steps.publish-platforms.outputs.curseforge == 'true' && vars.CURSEFORGE_PROJECT_ID || 'donotupload' }}
                    curseforge-token: ${{ steps.publish-platforms.outputs.curseforge == 'true' && secrets.CURSEFORGE_TOKEN || '' }}

                    modrinth-id: ${{ steps.publish-platforms.outputs.modrinth == 'true' && vars.MODRINTH_PROJECT_ID || 'donotupload' }}
                    modrinth-token: ${{ steps.publish-platforms.outputs.modrinth == 'true' && secrets.MODRINTH_TOKEN || '' }}
                    modrinth-featured: true

                    # [Fabric|Neoforge|Forge] ModName ModVersion for MinecraftVersion
                    name: ${{ format('[{0}] {1} {2} for {3}', matrix.mod_loader == 'fabric' && 'Fabric' || matrix.mod_loader == 'neoforge' && 'Neoforge' || matrix.mod_loader == 'forge' && 'Forge' || matrix.mod_loader, steps.gradle-properties.outputs.MOD_NAME, steps.gradle-properties.outputs.MOD_VERSION, steps.gradle-properties.outputs.DEPS_MINECRAFT) }}
                    version: mc${{ steps.gradle-properties.outputs.DEPS_MINECRAFT }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}-${{ matrix.mod_loader }}
                    loaders: ${{ join(matrix.supported_mod_loaders, ' ') }}
                    game-versions: ${{ steps.gradle-properties.outputs.MOD_FABRIC_RANGE }}
                    game-version-filter: releases
                    changelog-file: RELEASE_CHANGELOG.md
                    files: artifacts/${{ steps.gradle-properties.outputs.MOD_ID }}-${{ matrix.mod_loader }}-${{ steps.gradle-properties.outputs.MOD_VERSION }}+mc${{ matrix.version }}.jar # see buildSrc/src/main/kotlin/multiloader-common.gradle.kts

                    retry-attempts: 6
                    retry-delay: 30000
                    fail-mode: warn

            -   name: Publish state check
                run: |
                    enabled_github="${{ steps.publish-platforms.outputs.github }}"
                    enabled_curseforge="${{ steps.publish-platforms.outputs.curseforge }}"
                    enabled_modrinth="${{ steps.publish-platforms.outputs.modrinth }}"

                    github_url="${{ steps.mc-publish.outputs.github-url }}"
                    curseforge_url="${{ steps.mc-publish.outputs.curseforge-url }}"
                    modrinth_url="${{ steps.mc-publish.outputs.modrinth-url }}"

                    error=false

                    if [[ "$enabled_github" == "true" && -z "$github_url" ]]; then
                        echo "ERROR: GitHub platform is enabled but github-url output is missing"
                        error=true
                    fi

                    if [[ "$enabled_curseforge" == "true" && -z "$curseforge_url" ]]; then
                        echo "ERROR: CurseForge platform is enabled but curseforge-url output is missing"
                        error=true
                    fi

                    if [[ "$enabled_modrinth" == "true" && -z "$modrinth_url" ]]; then
                        echo "ERROR: Modrinth platform is enabled but modrinth-url output is missing"
                        error=true
                    fi

                    if [[ "$error" == "true" ]]; then
                        exit 1
                    fi

                    echo "All expected publish outputs are present:"
                    [[ "$enabled_github" == "true" ]] && echo "  ✓ GitHub: $github_url"
                    [[ "$enabled_curseforge" == "true" ]] && echo "  ✓ CurseForge: $curseforge_url"
                    [[ "$enabled_modrinth" == "true" ]] && echo "  ✓ Modrinth: $modrinth_url"
                    exit 0

