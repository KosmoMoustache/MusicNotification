# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defense
# against bad commits.

name: build
on: [ pull_request, push, workflow_call, workflow_dispatch ]

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        
        strategy:
            fail-fast: false
            matrix:

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v5

            -   name: Set up JDK 21
                uses: actions/setup-java@v5
                with:
                    distribution: "temurin"
                    java-version: 21

            -   name: "Setup gradle"
                uses: gradle/actions/setup-gradle@v5
                with:
                    cache-read-only: false
                    gradle-version: wrapper
                    add-job-summary: "on-failure"

            -   name: Grant execute permission to parse-gradle-properties.sh
                run: chmod +x ./.github/scripts/parse-gradle-properties.sh

            -   name: "Parse gradle properties"
                id: gradle-properties
                run: ./.github/scripts/parse-gradle-properties.sh

            -   name: Grant execute permission to gradlew
                run: chmod +x gradlew

            -   name: "Run build"
                run: ./gradlew build --debug --info --stacktrace

            -   name: "Prepare artifacts"
                run: |
                    mkdir -p artifacts
                    find . -path "./*/versions/*/build/libs/*.jar" ! -name "*-common*.jar" -exec cp {} artifacts/ \;

            -   name: "Upload artifacts"
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ steps.gradle-properties.outputs.MOD_ID }}-artifacts-${{ steps.gradle-properties.outputs.MOD_VERSION }}
                    if-no-files-found: error
                    path: artifacts/*.jar
